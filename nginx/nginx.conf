env NGINX_NAME;
env NGINX_TOTAL;
env FORWARD_PROBABILITY;
env APP_UPSTREAM;

worker_processes auto;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";

    resolver 127.0.0.11 ipv6=off valid=5s;

    init_worker_by_lua_block {
        math.randomseed(ngx.now() * 1000 + ngx.worker.pid())
    }

    log_format main '$remote_addr - "$request" status=$status '
                    'xff="$http_x_forwarded_for" visited="$http_x_visited_nginx"';

    access_log /dev/stdout main;

    server {
        listen 80 proxy_protocol;

        location / {
            set $target_upstream "";
            set $next_xff "";
            set $next_visited "";

            access_by_lua_block {
                require("router").route(true)
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $next_xff;
            proxy_set_header X-Visited-Nginx $next_visited;
            proxy_set_header X-Real-IP "";

            proxy_pass http://$target_upstream;
        }
    }

    server {
        listen 8080;

        location / {
            set $target_upstream "";
            set $next_xff "";
            set $next_visited "";

            access_by_lua_block {
                require("router").route(false)
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $next_xff;
            proxy_set_header X-Visited-Nginx $next_visited;
            proxy_set_header X-Real-IP "";

            proxy_pass http://$target_upstream;
        }
    }
}